{% extends "base.html" %}
{% block title %}Читать вместе — {{ book.title }}{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h2 class="mb-1"><i class="bi bi-people me-2"></i>Читать вместе</h2>
  <p class="text-muted mb-4">«{{ book.title }}»</p>
  <div class="card">
    <div class="card-body">
      <label class="form-label small text-muted">Код комнаты (с другого устройства)</label>
      <form onsubmit="return joinRoom()">
        <div class="input-group mb-2">
          <input type="text" id="roomCode" class="form-control text-uppercase" maxlength="5" placeholder="ABCDE" autofocus>
          <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Войти</button>
        </div>
      </form>
      <div id="joinError" class="text-danger small mt-2 d-none"></div>
    </div>
  </div>
  <a href="/books/{{ book.id }}" class="btn btn-link mt-3"><i class="bi bi-arrow-left me-1"></i>Назад к книге</a>
</div>
{% endblock %}

{% block scripts %}
<script>
function joinRoom() {
  var code = document.getElementById('roomCode').value.trim().toUpperCase();
  var err = document.getElementById('joinError');
  err.classList.add('d-none');
  if (code.length !== 5) {
    err.textContent = 'Код состоит из 5 символов';
    err.classList.remove('d-none');
    return false;
  }
  window.location.href = '/books/{{ book.id }}/sync/' + code;
  return false;
}
</script>
{% endblock %}
