<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — WeBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height:100vh">
<div class="container" style="max-width:400px">
  <div class="text-center mb-4">
    <h1 class="text-white"><i class="bi bi-book-half me-2"></i>WeBook</h1>
    <p class="text-secondary">Личная библиотека</p>
  </div>
  <div class="card shadow">
    <div class="card-body p-4">
      <h5 class="card-title mb-4">Войти</h5>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Логин</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label">Пароль</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>
      {% if can_register %}
      <hr class="my-3">
      <a href="/register" class="btn btn-outline-secondary w-100">
        <i class="bi bi-person-plus me-1"></i>Зарегистрироваться
      </a>
      {% endif %}
    </div>
  </div>
</div>
</body>
</html>
