{% extends "base.html" %}
{% block content %}
<div class="row g-3">
  <div class="col-12 col-md-3 col-lg-2">
    <h5 class="mb-3"><i class="bi bi-kanban me-2"></i>Рабочее пространство</h5>
    <div class="list-group">
      <a href="/workspace/tasks" class="list-group-item list-group-item-action {% if active == 'tasks' %}active{% endif %}">
        <i class="bi bi-check2-square me-2"></i>Задачи
      </a>
      <a href="/workspace/notes" class="list-group-item list-group-item-action {% if active == 'notes' %}active{% endif %}">
        <i class="bi bi-journal-text me-2"></i>Заметки
      </a>
      <a href="/workspace/timer" class="list-group-item list-group-item-action {% if active == 'timer' %}active{% endif %}">
        <i class="bi bi-stopwatch me-2"></i>Тайм-менеджер
      </a>
    </div>
  </div>
  <div class="col-12 col-md-9 col-lg-10">
    {% block ws %}{% endblock %}
  </div>
</div>
{% endblock %}
