{% extends "workspace/base.html" %}
{% block title %}{{ note.title }} — Заметка{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
{% endblock %}
{% block ws %}
<form method="post" action="/workspace/notes/{{ note.id }}" id="noteForm">
  <div class="d-flex gap-2 align-items-center mb-2 flex-wrap">
    <a href="/workspace/notes" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
    <input name="title" class="form-control flex-grow-1" value="{{ note.title }}" style="max-width:460px">
    <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Сохранить</button>
    <a href="/workspace/notes/{{ note.id }}/export" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>.md</a>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="imgBtn"><i class="bi bi-image me-1"></i>Картинка</button>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <button type="button" class="btn btn-outline-danger btn-sm ms-auto"
            onclick="if(confirm('Удалить заметку?'))document.getElementById('delForm').submit()"><i class="bi bi-trash"></i></button>
  </div>
  <div class="row g-2 mb-2 align-items-center">
    <div class="col-auto"><label class="small text-muted"><i class="bi bi-bell me-1"></i>Напоминание</label></div>
    <div class="col-auto">
      <input type="datetime-local" name="remind_at" class="form-control form-control-sm"
             value="{{ note.remind_at.strftime('%Y-%m-%dT%H:%M') if note.remind_at else '' }}">
    </div>
    <div class="col-auto"><span class="small text-muted" id="notifyHint"></span></div>
  </div>
  <div class="row g-2">
    <div class="col-lg-6">
      <textarea name="content" id="noteContent" class="form-control font-monospace" rows="20" style="resize:vertical">{{ note.content }}</textarea>
    </div>
    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body" id="preview" style="overflow:auto;max-height:70vh"></div></div>
    </div>
  </div>
</form>
<form method="post" action="/workspace/notes/{{ note.id }}/delete" id="delForm" class="d-none"></form>
{% endblock %}
{% block scripts %}
<script>
const ta = document.getElementById('noteContent');
const preview = document.getElementById('preview');
function render(){ preview.innerHTML = marked.parse(ta.value || ''); }
ta.addEventListener('input', render); render();

const imgBtn = document.getElementById('imgBtn'), imgInput = document.getElementById('imgInput');
imgBtn.addEventListener('click', () => imgInput.click());
imgInput.addEventListener('change', async function () {
  if (!this.files[0]) return;
  const fd = new FormData(); fd.append('file', this.files[0]);
  const r = await fetch('/workspace/upload-image', { method: 'POST', body: fd });
  if (!r.ok) { alert('Не удалось загрузить изображение'); return; }
  const j = await r.json();
  const md = '\n![](' + j.url + ')\n';
  const pos = ta.selectionStart;
  ta.value = ta.value.slice(0, pos) + md + ta.value.slice(pos);
  render();
  this.value = '';
});

(function () {
  const remind = {{ (note.remind_at.isoformat() if note.remind_at else '')|tojson }};
  const title = {{ note.title|tojson }};
  const hint = document.getElementById('notifyHint');
  if (!remind || !('Notification' in window)) return;
  if (Notification.permission === 'default') {
    hint.textContent = 'нажмите, чтобы разрешить уведомления';
    hint.style.cursor = 'pointer';
    hint.onclick = () => Notification.requestPermission().then(() => hint.textContent = '');
  }
  const when = new Date(remind).getTime();
  const iv = setInterval(function () {
    if (Date.now() >= when) {
      if (Notification.permission === 'granted') new Notification('Напоминание: ' + title);
      clearInterval(iv);
    }
  }, 15000);
})();
</script>
{% endblock %}
