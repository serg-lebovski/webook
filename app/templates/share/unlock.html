{% extends "share/base.html" %}
{% block title %}Защищено паролем — WeBook{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5">
    <div class="card">
      <div class="card-body text-center">
        <i class="bi bi-lock-fill text-secondary" style="font-size:2.4rem"></i>
        <h5 class="mt-2">Ссылка защищена паролем</h5>
        {% if bad %}<div class="alert alert-danger py-2">Неверный пароль.</div>{% endif %}
        <form method="post" action="/share/{{ token }}/unlock" class="mt-3">
          <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required autofocus>
          <button class="btn btn-primary w-100"><i class="bi bi-unlock me-1"></i>Открыть</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
