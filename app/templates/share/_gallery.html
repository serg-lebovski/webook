<div id="lightbox" style="display:none;position:fixed;inset:0;z-index:1080;background:rgba(0,0,0,.9);
     align-items:center;justify-content:center;flex-direction:column">
  <img id="lbImg" style="max-width:92vw;max-height:82vh;object-fit:contain;border-radius:4px">
  <div class="text-white-50 small mt-2" id="lbName"></div>
  <button id="lbPrev" class="btn btn-light position-absolute top-50 start-0 ms-2" style="opacity:.85"><i class="bi bi-chevron-left"></i></button>
  <button id="lbNext" class="btn btn-light position-absolute top-50 end-0 me-2" style="opacity:.85"><i class="bi bi-chevron-right"></i></button>
  <button id="lbClose" class="btn btn-light position-absolute top-0 end-0 m-3" style="opacity:.85"><i class="bi bi-x-lg"></i></button>
</div>
<script>
  (function () {
    const imgs = Array.from(document.querySelectorAll('.gallery-img'));
    if (!imgs.length) return;
    const box = document.getElementById('lightbox');
    const big = document.getElementById('lbImg');
    const name = document.getElementById('lbName');
    let idx = 0;
    function show(i) {
      idx = (i + imgs.length) % imgs.length;
      const el = imgs[idx];
      big.src = el.dataset.full || el.src;
      name.textContent = el.dataset.name || '';
    }
    function open(i) { show(i); box.style.display = 'flex'; }
    function close() { box.style.display = 'none'; big.src = ''; }
    imgs.forEach((el, i) => el.addEventListener('click', () => open(i)));
    document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
    document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
    document.getElementById('lbClose').addEventListener('click', close);
    box.addEventListener('click', e => { if (e.target === box) close(); });
    document.addEventListener('keydown', e => {
      if (box.style.display === 'none') return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });
  })();
</script>
