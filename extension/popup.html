<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 300px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; color: #1e293b; background: #fff; }

.header {
  background: #2563eb;
  color: white;
  padding: 11px 14px;
  font-weight: 600;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.content { padding: 14px; }

.section { display: none; }
.section.active { display: block; }

label {
  display: block;
  margin-bottom: 4px;
  font-size: 12px;
  color: #64748b;
  font-weight: 500;
}

input, select {
  width: 100%;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  margin-bottom: 10px;
  background: #fff;
  color: #1e293b;
}
input:focus, select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37,99,235,.15);
}

button {
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 12px;
  transition: background .15s;
}
.btn-primary { background: #2563eb; color: #fff; width: 100%; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: #f1f5f9; color: #475569; }
.btn-secondary:hover { background: #e2e8f0; }
.btn-sm { padding: 6px 10px; font-size: 12px; }

.link-info {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 9px 11px;
  margin-bottom: 12px;
}
.link-title {
  font-weight: 500;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
}
.link-url {
  font-size: 11px;
  color: #94a3b8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row { display: flex; gap: 6px; align-items: flex-end; margin-bottom: 10px; }
.row select { margin-bottom: 0; flex: 1; }

.new-folder-row { display: none; margin-bottom: 10px; }
.new-folder-row input { margin-bottom: 6px; }

.alert {
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12px;
  margin-bottom: 10px;
  line-height: 1.4;
}
.alert-success { background: #dcfce7; color: #166534; }
.alert-error   { background: #fee2e2; color: #991b1b; }

.footer {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid #f1f5f9;
}
.footer button {
  background: none;
  border: none;
  font-size: 11px;
  color: #94a3b8;
  padding: 0;
  cursor: pointer;
}
.footer button:hover { color: #475569; }
</style>
</head>
<body>

<div class="header">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
  </svg>
  WeBook
</div>

<div class="content">

  <!-- Форма входа -->
  <div id="section-login" class="section active">
    <label>Адрес сервера</label>
    <input id="server-url" type="url" placeholder="https://webook.example.com">

    <label>Логин</label>
    <input id="login-username" type="text" placeholder="username" autocomplete="username">

    <label>Пароль</label>
    <input id="login-password" type="password" placeholder="••••••" autocomplete="current-password">

    <div id="login-error" class="alert alert-error" style="display:none"></div>

    <button class="btn-primary" id="btn-login">Войти</button>
  </div>

  <!-- Сохранение ссылки -->
  <div id="section-save" class="section">
    <div class="link-info">
      <div class="link-title" id="tab-title">—</div>
      <div class="link-url"  id="tab-url">—</div>
    </div>

    <label>Папка</label>
    <div class="row">
      <select id="folder-select"><option value="">Без папки</option></select>
      <button class="btn-secondary btn-sm" id="btn-toggle-new-folder">+ Папка</button>
    </div>

    <div class="new-folder-row" id="new-folder-row">
      <input id="new-folder-name" type="text" placeholder="Название новой папки">
      <button class="btn-secondary" id="btn-create-folder" style="width:100%">Создать папку</button>
    </div>

    <div id="save-alert" class="alert" style="display:none"></div>

    <button class="btn-primary" id="btn-save">Сохранить ссылку</button>

    <div class="footer">
      <button id="btn-settings">⚙ Настройки входа</button>
      <button id="btn-logout">Выйти</button>
    </div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
